name: Build & Publish ElinkBridge

on:
  workflow_dispatch:
  push:
    paths:
      - "ElinkBridge/**"
      - "tools/rebuild_index.py"
      - ".github/workflows/build-elinkbridge.yml"
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compile deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang dpkg-dev zstd xz-utils bzip2 file
          # ldid 不在 Ubuntu 官方源，从 Procursus 官方 release 下载 Linux 静态二进制
          curl -sL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          chmod +x /usr/local/bin/ldid
          ldid 2>&1 | head -1 || true

      - name: Install Theos + iOS SDK + Linux toolchain
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/theos/sdks"
          git -C "$HOME/theos/sdks" sparse-checkout set iPhoneOS14.5.sdk
          ls "$HOME/theos/sdks"
          # Linux iOS 交叉工具链（与官方 install-theos 相同的来源）
          mkdir -p "$HOME/theos/toolchain"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C "$HOME/theos/toolchain/"
          ls "$HOME/theos/toolchain/linux/iphone/bin/" | head
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build ElinkBridge DEB
        working-directory: ElinkBridge
        run: |
          make package
          ls -la packages/

      - name: Copy DEB to repo debs/
        run: |
          mkdir -p debs
          cp ElinkBridge/packages/*.deb debs/
          ls -la debs/

      - name: Rebuild repo index (Packages/Release)
        run: python3 tools/rebuild_index.py

      - name: Commit & push back
        run: |
          DEB_NAME=$(ls ElinkBridge/packages/ | head -1)
          git config user.name "chen1203260599-web"
          git config user.email "chen1203260599-web@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "publish ElinkBridge ${DEB_NAME}"
            git push origin main
          fi
